# gbmux-acpower configuration — parsed (not sourced) by /usr/lib/gbmux/gbmux-acpower.
#
# KILL_ON_BATTERY: space-separated process names allowed to be killed when
# they hold the dGPU on an unplug event. The app restarts without the GPU
# and falls back to iGPU/software paths (e.g. rustdesk NVENC -> x264).
#
# WARNING: killed apps lose GPU-side work. Only list things you don't mind
# restarting. Leave empty to never kill anything (default: skip eject).
#
# Example:
# KILL_ON_BATTERY="rustdesk"

KILL_ON_BATTERY=""
